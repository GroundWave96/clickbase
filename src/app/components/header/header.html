<header class="w-full py-4 px-8 flex justify-between items-center bg-slate-900 border-b border-slate-800">
  
  <a routerLink="/" class="text-2xl font-bold text-white tracking-tight cursor-pointer hover:opacity-80 transition-opacity">
    Click<span class="text-emerald-400">Base</span>
  </a>

  <nav>
    @if (isLoggedIn) {
      <div class="flex items-center gap-4">
        <span class="text-sm text-gray-400 hidden sm:inline-block">
          Olá, {{ userName ? userName.split(' ')[0] : '' }}
        </span>
        
        <a routerLink="/dashboard" 
           class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-6 rounded-full transition-colors shadow-sm">
          Acessar Dashboard
        </a>
      </div>
    } @else {
      <div id="google-btn"></div>
    }
  </nav>

</header>
