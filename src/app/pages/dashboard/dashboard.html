@if (user) {
  <div class="min-h-screen bg-slate-900 text-white p-8">
    <img [src]="user.picture" class="rounded-full w-20 h-20 mb-4" referrerpolicy="no-referrer" />
    <h1 class="text-3xl font-bold">Olá, {{ user.name }}!</h1>
    <p class="text-gray-400">Email registrado: {{ user.email }}</p>
    <p class="mt-4 text-sm text-green-400">Dados carregados diretamente do Cloudflare D1.</p>
  </div>
} @else {
  <div class="min-h-screen bg-slate-900 text-white p-8 flex items-center justify-center">
    <p class="text-xl animate-pulse">Carregando dados do servidor...</p>
  </div>
}
